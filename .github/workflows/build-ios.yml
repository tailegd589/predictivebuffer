name: Build iOS dylib
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build with Geode SDK
        uses: geode-sdk/build-geode-mod@main
        id: build
        with:
          platform: ios
          build-config: Release

      - name: Rename dylib
        run: |
          find . -name "*.dylib" | grep -v _deps | head -1
          DYLIB=$(find ${{ steps.build.outputs.build-output }} -name "*.dylib" | head -1)
          cp "$DYLIB" ai.predictivebuffer.ios.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: ai.predictivebuffer-ios
          path: ai.predictivebuffer.ios.dylib
