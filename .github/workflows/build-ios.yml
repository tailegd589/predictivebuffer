name: Build iOS dylib
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install Geode CLI
        run: brew install geode-sdk/geode/geode-cli
      - name: Setup Geode SDK
        run: |
          geode sdk install --path ~/geode-sdk
          geode sdk update
          echo "GEODE_SDK=$HOME/geode-sdk" >> $GITHUB_ENV
      - name: Install iOS binaries
        run: geode sdk install-binaries --platform ios
      - name: Configure
        run: |
          cmake -B build-ios -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0
      - name: Build
        run: cmake --build build-ios --config Release -j$(sysctl -n hw.logicalcpu)
      - name: Pack
        run: |
          DYLIB=$(find build-ios -name "*.dylib" | grep -v _deps | head -1)
          cp "$DYLIB" ai.predictivebuffer.ios.dylib
          cp 2.geode ai.predictivebuffer.geode
          zip -u ai.predictivebuffer.geode ai.predictivebuffer.ios.dylib mod.json
      - uses: actions/upload-artifact@v4
        with:
          name: ai.predictivebuffer-ios
          path: |
            ai.predictivebuffer.ios.dylib
            ai.predictivebuffer.geode
