name: Build iOS dylib
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install Geode CLI
        run: |
          brew install geode-sdk/geode/geode-cli
          geode --version

      - name: Clone Geode SDK
        run: |
          git clone --depth 1 --branch v5.11.2 \
            https://github.com/geode-sdk/geode.git $HOME/geode-sdk
          echo "GEODE_SDK=$HOME/geode-sdk" >> $GITHUB_ENV

      - name: Patch Geode SDK
        run: |
          # 1. Loader binary check → WARNING
          sed -i '' '403s/FATAL_ERROR/WARNING/' $HOME/geode-sdk/CMakeLists.txt
          # 2. Thêm FMOD include vào GeodeBindings để fix FunctionType/FMOD_RESULT
          FMOD_DIR="$HOME/geode-sdk/loader/include/Geode/fmod"
          python3 - <<PYEOF
import re, pathlib
p = pathlib.Path("$HOME/geode-sdk/CMakeLists.txt")
txt = p.read_text()
# Thêm include_directories sau setup_geode_mod target để GeodeBindings thấy FMOD
patch = '\ntarget_include_directories(GeodeBindings PUBLIC "$FMOD_DIR")\n'
# Chèn sau dòng "add_library(GeodeBindings"
txt2 = re.sub(r'(add_library\s*\(\s*GeodeBindings[^\)]*\))',
              r'\1' + patch, txt, count=1)
if txt2 == txt:
    # fallback: append at end
    txt2 = txt + patch
p.write_text(txt2)
print("Patch applied")
PYEOF

      - name: Configure CMake
        run: |
          cmake -B build-ios -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DCMAKE_CXX_STANDARD=23 \
            -DGEODE_DISABLE_PRECOMPILED_HEADERS=ON \
            "-DCMAKE_CXX_FLAGS=-isystem $HOME/geode-sdk/loader/include/Geode/fmod" \
            -DCMAKE_SHARED_LINKER_FLAGS="-Wl,-undefined,dynamic_lookup"

      - name: Build
        run: cmake --build build-ios -j$(sysctl -n hw.logicalcpu)

      - name: Collect dylib
        run: |
          DYLIB=$(find build-ios -name "*.dylib" | grep -v _deps | head -1)
          echo "Found: $DYLIB"
          file "$DYLIB"
          cp "$DYLIB" ai.predictivebuffer.ios.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: ai.predictivebuffer-ios
          path: ai.predictivebuffer.ios.dylib
