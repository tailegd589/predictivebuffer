name: Build iOS dylib
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Clone Geode SDK
        run: |
          git clone --depth 1 --branch v5.11.2 \
            https://github.com/geode-sdk/geode.git $HOME/geode-sdk
          echo "GEODE_SDK=$HOME/geode-sdk" >> $GITHUB_ENV

      - name: Patch CMakeLists - skip loader binary check
        run: |
          # Đổi FATAL_ERROR thành WARNING ở check loader binary
          sed -i '' \
            's/message(FATAL_ERROR "No valid loader binary/message(WARNING "No valid loader binary/g' \
            $HOME/geode-sdk/CMakeLists.txt
          # Verify patch
          grep -n "loader binary" $HOME/geode-sdk/CMakeLists.txt

      - name: Configure CMake
        run: |
          cmake -B build-ios -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DGEODE_DISABLE_PRECOMPILED_HEADERS=ON \
            -DCMAKE_SHARED_LINKER_FLAGS="-Wl,-undefined,dynamic_lookup"

      - name: Build
        run: cmake --build build-ios -j$(sysctl -n hw.logicalcpu)

      - name: Collect dylib
        run: |
          DYLIB=$(find build-ios -name "*.dylib" | grep -v _deps | head -1)
          echo "Found: $DYLIB"
          file "$DYLIB"
          cp "$DYLIB" ai.predictivebuffer.ios.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: ai.predictivebuffer-ios
          path: ai.predictivebuffer.ios.dylib
