name: Build iOS dylib
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install Geode CLI
        run: brew install geode-sdk/geode/geode-cli && geode --version

      - name: Clone Geode SDK
        run: |
          git clone --depth 1 --branch v5.11.2 \
            https://github.com/geode-sdk/geode.git $HOME/geode-sdk
          echo "GEODE_SDK=$HOME/geode-sdk" >> $GITHUB_ENV

      - name: Patch Geode SDK
        run: sed -i '' '403s/FATAL_ERROR/WARNING/' $HOME/geode-sdk/CMakeLists.txt

      - name: Configure CMake
        run: |
          FMOD="$HOME/geode-sdk/loader/include/Geode/fmod"
          cmake -B build-ios -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DCMAKE_CXX_STANDARD=23 \
            -DGEODE_DISABLE_PRECOMPILED_HEADERS=ON \
            "-DCMAKE_CXX_FLAGS=-isystem $FMOD" \
            -DCMAKE_SHARED_LINKER_FLAGS="-Wl,-undefined,dynamic_lookup"

      - name: Patch GeneratedSource.cpp
        run: |
          find build-ios/bindings -name "unity_*.cxx" | while read f; do
            if grep -q "GeneratedSource" "$f" 2>/dev/null; then
              echo '#include <fmod.hpp>' | cat - "$f" > /tmp/_u.cpp && mv /tmp/_u.cpp "$f"
            fi
          done

      - name: Build
        run: cmake --build build-ios -j$(sysctl -n hw.logicalcpu) || true

      - name: Collect outputs
        run: |
          echo "=== Searching for dylib ==="
          find build-ios -name "*.dylib" 2>/dev/null
          find build-ios -name "*.geode" 2>/dev/null
          DYLIB=$(find build-ios -name "ai.predictivebuffer.ios.dylib" | head -1)
          if [ -z "$DYLIB" ]; then
            DYLIB=$(find build-ios -name "*.dylib" | grep -v _deps | head -1)
          fi
          echo "Using: $DYLIB"
          file "$DYLIB"
          cp "$DYLIB" ai.predictivebuffer.ios.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: ai.predictivebuffer-ios
          path: ai.predictivebuffer.ios.dylib
