name: Build iOS dylib
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install Geode CLI
        run: |
          brew install geode-sdk/geode/geode-cli
          geode --version

      - name: Setup Geode SDK
        run: |
          geode sdk install --path $HOME/geode-sdk
          echo "GEODE_SDK=$HOME/geode-sdk" >> $GITHUB_ENV

      - name: Install iOS binaries
        run: |
          geode sdk install-binaries --platform ios
          ls $HOME/geode-sdk/bin/

      - name: Configure CMake
        run: |
          cmake -B build-ios -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DGEODE_DISABLE_PRECOMPILED_HEADERS=ON

      - name: Build
        run: cmake --build build-ios -j$(sysctl -n hw.logicalcpu)

      - name: Collect dylib
        run: |
          cp $(find build-ios -name "*.dylib" | grep -v _deps | head -1) \
             ai.predictivebuffer.ios.dylib
          file ai.predictivebuffer.ios.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: ai.predictivebuffer-ios
          path: ai.predictivebuffer.ios.dylib
